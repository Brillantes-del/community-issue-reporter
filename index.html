
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Issue Reporter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="container">
            <h1>Community Issue Reporter</h1>
            <p>Making our community better together.</p>
        </div>
    </header>

    <main class="container">
        <section class="welcome">
            <h2>Welcome to Our Community</h2>
            <p>
                Help improve our community by reporting local issues.
                Together, we can make our surroundings safer and better.
            </p>
        </section>

        <section class="report-section">
		    <h2>Report a Community Issue</h2>
		    <p class="section-description">
		        Provide the details of the issue you want to report.
		    </p>

		    <form id="issueForm">

		        <div class="form-group">
		            <label for="title">Issue Title</label>
		            <input
		                type="text"
		                id="title"
		                placeholder="Enter issue title"
		                required
		            >
		        </div>

		        <div class="form-group">
		            <label for="category">Category</label>
		            <select id="category" required>
		                <option value="">Select a category</option>
		                <option value="Garbage Disposal">Garbage Disposal</option>
		                <option value="Road Maintenance">Road Maintenance</option>
		                <option value="Broken Streetlight">Broken Streetlight</option>
		                <option value="Drainage Problem">Drainage Problem</option>
		                <option value="Other">Other</option>
		            </select>
		        </div>

		        <div class="form-group">
		            <label for="location">Location</label>
		            <input
		                type="text"
		                id="location"
		                placeholder="Enter the location"
		                required
		            >
		        </div>

		        <div class="form-group">
		            <label for="description">Description</label>
		            <textarea
		                id="description"
		                rows="4"
		                placeholder="Describe the issue..."
		                required
		            ></textarea>
		        </div>

		        <button type="submit">Submit Report</button>

		    </form>
		</section>
    </main>

    <script src="script.js"></script>
</body>
</html>
